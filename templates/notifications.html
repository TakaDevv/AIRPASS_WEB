{% extends "base.html" %}
{% block title %}Notifications{% endblock %}
{% block content %}
<div class="container my-4" style="max-width:700px;">
    <h3 class="section-title">Historique des notifications</h3>
    <div class="list-group shadow-sm">
        {% for n in notifications %}
        <div class="list-group-item d-flex justify-content-between align-items-start py-3">
            <div>
                <i class="bi bi-bell-fill text-danger me-2"></i>{{ n.message }}
            </div>
            <small class="text-muted text-nowrap ms-3">{{ n.created_at.strftime('%d/%m/%Y %H:%M') }}</small>
        </div>
        {% else %}
        <div class="list-group-item text-muted">Aucune notification pour le moment.</div>
        {% endfor %}
    </div>
</div>
{% endblock %}
